; Tarot for the Waveshare ESP32-S3-Touch-AMOLED-1.75 round board.
; Build/flash: pio run -t uploadfs && pio run -t upload
; The Headroom LaunchAgent often owns /dev/cu.usbmodem*. See AGENTS.md.
[platformio]
default_envs = amoled-175-round

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/data_dir.py
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7
    lewisxhe/XPowersLib@^0.2.7

; Waveshare ESP32-S3-Touch-AMOLED-1.75 (no C): round 466x466 CO5300, CST9217
; touch, AXP2101. Panel, touch and PMU handling copied from esp32-lofiair's
; amoled-175c target and esp32-thinking-orbs.
[env:amoled-175-round]
build_flags =
    -DBOARD_ROUND_175
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -O2
